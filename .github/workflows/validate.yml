name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - name: Engine tests
        run: npm test
      - name: Contract and scaffolding tests
        run: python3 -m unittest discover -s tests
      - name: Repository privacy boundary
        run: python3 scripts/validate_repo.py
