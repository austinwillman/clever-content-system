name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run repository validator
        run: python3 scripts/validate_repo.py
      - name: Run candidate contract validator
        run: |
          python3 scripts/validate_candidate.py \
            schemas/examples/content-candidate.example.json \
            templates/client-workspace/candidates/content-candidates.json
