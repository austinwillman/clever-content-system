schema_version: "1.0"
client:
  identifier: "<client-identifier>"
  display_name: "<client-display-name>"
active_90_day_objective:
  statement: "<measurable 90-day content objective>"
  success_metric: "<primary metric>"
  target_value: "<target value>"
content_pillars:
  - id: pillar-1
    name: "<pillar one>"
    purpose: "<what this pillar should accomplish>"
  - id: pillar-2
    name: "<pillar two>"
    purpose: "<what this pillar should accomplish>"
  - id: pillar-3
    name: "<pillar three>"
    purpose: "<what this pillar should accomplish>"
  - id: pillar-4
    name: "<pillar four>"
    purpose: "<what this pillar should accomplish>"
cadence:
  cycle_days: 6
  days:
    - day: 1
      focus: "<content focus>"
    - day: 2
      focus: "<content focus>"
    - day: 3
      focus: "<content focus>"
    - day: 4
      focus: "<content focus>"
    - day: 5
      focus: "<content focus>"
    - day: 6
      focus: "<content focus>"
cta_ladder:
  - stage: awareness
    call_to_action: "<low-friction next step>"
    destination: "<relative or approved destination>"
  - stage: consideration
    call_to_action: "<evaluation next step>"
    destination: "<relative or approved destination>"
  - stage: conversion
    call_to_action: "<commitment next step>"
    destination: "<relative or approved destination>"
locations:
  content_context: content-context.md
  demand_map: research/demand-map.csv
  trend_library: research/trend-library.json
  transcript_index: sources/transcript-index.json
  content_history: history/content-history.csv
approval_gate:
  required_before: production
  approved_by: "<role or person responsible for approval>"
  record_location: approvals/approval-record.md
fatigue_rules:
  lookback_days: 30
  max_reuses_per_topic: 2
  max_reuses_per_hook: 1
  action_when_triggered: "<refresh angle, format, or source before reuse>"
last_refresh_dates:
  content_context: null
  demand_map: null
  trend_library: null
  transcript_index: null
  content_history: null
